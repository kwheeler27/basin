# Reclamation lookout: new 24-Month Study editions and post-2026 page
# changes (incl. the Record of Decision tripwire). Opens a PR updating the
# committed watch state; the PR body is the alert. Distinct from the data
# refreshes — this watches for PUBLICATIONS we don't yet ingest.
name: Reclamation lookout

on:
  schedule:
    - cron: "23 12 * * 2" # Tuesdays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for new publications
        id: watch
        working-directory: apps/web
        run: |
          node scripts/usbr-watch.mjs | tee /tmp/watch-out.txt
      - name: Open alert PR if state changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet watch/; then echo "no changes"; exit 0; fi
          BRANCH="watch/usbr-$(date -u +%Y%m%d)"
          git config user.name "basin-watch"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add watch/
          git commit -m "watch: Reclamation publication state ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Reclamation lookout: $(head -1 /tmp/watch-out.txt | cut -c1-60)" \
            --body "$(cat /tmp/watch-out.txt)

Merging records the new state. If this is a new 24-Month Study, the backtest-page queue item just got fresher; if the ROD tripwire fired, the operating-rules banner and rulebook succession need review."
