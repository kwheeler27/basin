# Weekly re-bake of the Markets ledgers (CO / UT / CA) from their agencies.
#
# The bake scripts carry shape assertions that fail loudly if an agency
# changes its page/API structure — a red run here means "go look," never
# silently stale data. On changes, opens a PR (main is protected; Kevin
# merges). Note: scheduled workflows run from the default branch only, so
# this is dormant until the feature stack lands in main. Deploys stay
# manual (Vercel is CLI-driven, not GitHub-connected).
name: Re-bake market ledgers

on:
  schedule:
    - cron: "17 11 * * 1" # Mondays 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bakes
        working-directory: apps/web
        run: |
          node scripts/build-transactions.mjs
          node scripts/build-ut-changes.mjs
          node scripts/build-ca-petitions.mjs
      - name: Open PR if artifacts changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet apps/web/public/geo; then
            echo "ledgers unchanged"; exit 0
          fi
          BRANCH="bake/ledgers-$(date -u +%Y%m%d)"
          git config user.name "basin-bake"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add apps/web/public/geo
          git commit -m "bake: weekly ledger refresh ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "bake: weekly ledger refresh $(date -u +%Y-%m-%d)" \
            --body "Automated re-bake of the CO/UT/CA market ledgers. Diff is the week's change activity; shape assertions passed. Deploy via CLI after merge."
