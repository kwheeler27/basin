[project]
name = "basin-model"
version = "0.1.0"
description = "Basin simulation model — mass balance, rules engine, hydrology"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["basin_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
