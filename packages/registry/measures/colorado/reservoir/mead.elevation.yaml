id: colorado.reservoir.mead.elevation
label: Lake Mead pool elevation
description: >
  Water surface elevation of Lake Mead above mean sea level. The operative
  variable for shortage-tier determination (via projected January 1 elevation)
  and the critical thresholds at 1,075 / 1,050 / 1,025 ft (tiers), ~950 ft
  (minimum power pool), and 895 ft (dead pool).

quantity_kind: Length
canonical_unit: foot
measurement_class: observed
accounting_concept: stage
temporal_semantics: instantaneous
grain: P1D
calendar: water_year
spatial_ref: { type: reservoir, id: usbr.lake_mead }

