uncertainty: none_published

caveats:
  - >
    Tier determination does not use current elevation: it uses the projected
    January 1 elevation from the August 24-Month Study. Displaying current
    elevation against tier thresholds requires that framing.

not_comparable_with:
  - measure: colorado.reservoir.mead.storage
    reason: >
      Elevation maps to storage only through the (re-surveyed, nonlinear)
      area-capacity table — never by linear scaling.
