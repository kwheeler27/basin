  endpoint: https://data.usbr.gov/rise/api/result?itemId=6123
  retrieved_via: http_json
  license: public_domain_us_gov
  citation: >
    U.S. Bureau of Reclamation, RISE, Lake Mead pool elevation, catalog item
    6123. Period of record from 1935-02-02. Accessed {access_date}.

ingest:
