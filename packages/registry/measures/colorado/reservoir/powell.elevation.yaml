id: colorado.reservoir.powell.elevation
label: Lake Powell pool elevation
description: >
  Water surface elevation of Lake Powell above mean sea level. The operative
  variable for release-tier determination (via projected January 1 elevation),
  with critical thresholds at 3,575 / 3,525 ft (tier boundaries), 3,490 ft
  (minimum power pool, medium confidence), and 3,370 ft (dead pool).

