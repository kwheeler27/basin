id: colorado.structure.grand_valley_canal.diversion
label: Grand Valley Canal — headgate diversion
description: >
  Daily flow diverted from the Colorado River into the Grand Valley Canal
  (WDID 7200645, Mesa County), measured at the headgate and recorded by
  Colorado's water commissioners. Water rights on this canal date to 1882.
  The first structure-level (farm-scale) series in the registry.

quantity_kind: VolumeFlowRate
canonical_unit: cubic_foot_per_second
measurement_class: observed
accounting_concept: diversion
temporal_semantics: interval_mean
grain: P1D
calendar: water_year
spatial_ref: { type: station, id: codwr.7200645 }

provenance:
  agency: Colorado Division of Water Resources
  system: CDSS REST API
  site_id: "7200645"
  endpoint: https://dwr.state.co.us/Rest/GET/api/v2/structures/divrec/divrecday/?wdid=7200645
  retrieved_via: http_json
  license: public_domain
  citation: >
    Colorado Division of Water Resources, Colorado's Decision Support
    Systems (CDSS), daily diversion records for WDID 7200645 (Grand Valley
    Canal), irrigation water class. Accessed {access_date}.

ingest:
  adapter: manual
  params: { wdid: "7200645", water_class: 101479 }

revision_policy:
  status: provisional
  detect_via: approvalStatus
  note: >
    Every record carries approvalStatus (Provisional -> Approved on the
    commissioner review cycle).

freshness:
  expected_cadence: P1D
  sla_hours: 72
  note: Seasonal — the canal runs roughly April through October.

uncertainty: none_published

caveats:
  - >
    This is a DIVERSION at one headgate, not consumptive use — return flows
    from the Grand Valley re-enter the river downstream.
  - >
    One headgate carries multiple water classes (irrigation plus a small
    stock/domestic class); this measure is the irrigation class only.
    Summing all classes at a WDID double-counts.
  - >
    The canal is a mutual-company structure serving many farms; attribution
    below the headgate is not knowable from public records.

not_comparable_with:
  - measure: colorado.upper_basin.consumptive_use
    reason: "Diversion vs. consumptive use — return flows make these different quantities."
